      additionalProperties: false
      properties:
        default_locale:
          type: "string"
          maxLength: 64
        state: {"$ref":"#/components/schemas/TaxonomyState"}
    CreateResource:
      type: "object"
      additionalProperties: false
      required: ["slug","default_locale","category_id","content_rating","localization"]
      properties:
