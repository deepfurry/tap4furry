components:
  securitySchemes:
    AdminSession:
      type: apiKey
      in: cookie
      name: __Host-tap4furry_admin_session
      description: Production Secure HttpOnly SameSite Strict host-only cookie, Path /. Local development/test uses tap4furry_admin_session without Secure. Absolute lifetime 8h, idle 1h, touch interval 5m.
  parameters:
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string}
  responses:
    Authenticated:
      description: Password verified and independent Admin session committed; HttpOnly Admin cookie set.
      headers:
        Set-Cookie:
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdminMe'}
    Error:
      description: Stable safe error without credential, account eligibility or driver details. 503 INTERNAL_ERROR indicates unavailable Admin authentication infrastructure.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
  schemas:
    PublicationState:
      type: "string"
      enum: ["draft","pending","published","restricted","removed"]
    Lifecycle:
      type: "string"
      enum: ["active","inactive","discontinued","delisted","archived","unknown"]
    ContentRating:
      type: "string"
      enum: ["general","mature","explicit"]
    TaxonomyState:
      type: "string"
      enum: ["active","retired"]
    SourceType:
      type: "string"
      enum: ["official","store","archive","mirror","community","external","unknown"]
    AvailabilityState:
      type: "string"
      enum: ["active","unavailable","broken","removed","restricted"]
    RightsStatus:
      type: "string"
      enum: ["unknown","creator_provided","confirmed","disputed","rights_review","removed_by_request"]
    RelationType:
      type: "string"
      enum: ["part_of","successor_of","derived_from","related_to"]
    ResourceRevision:
      type: "object"
      additionalProperties: false
      required: ["id","version"]
      properties:
        id:
          type: "string"
          format: "uuid"
          x-go-type: "string"
        version:
          type: "integer"
          format: "int64"
          minimum: 1
    EntityID:
      type: "object"
      additionalProperties: false
      required: ["id"]
      properties:
        id:
          type: "string"
          format: "uuid"
          x-go-type: "string"
    ResourceLocalizationInput:
      type: "object"
      additionalProperties: false
      required: ["name"]
      properties:
        name:
          type: "string"
          maxLength: 160
          minLength: 1
        summary:
          type: "string"
          maxLength: 500
          nullable: true
        description:
          type: "string"
          maxLength: 50000
          nullable: true
    TaxonomyLocalizationInput:
      type: "object"
      additionalProperties: false
      required: ["name"]
      properties:
        name:
          type: "string"
          maxLength: 80
          minLength: 1
        description:
          type: "string"
          maxLength: 500
          nullable: true
    ResourceLocalization:
      type: "object"
      additionalProperties: false
      required: ["locale","name","summary","description"]
      properties:
        locale:
          type: "string"
          maxLength: 64
        name:
          type: "string"
          maxLength: 160
        summary:
          type: "string"
          maxLength: 500
          nullable: true
        description:
          type: "string"
          maxLength: 50000
          nullable: true
    TaxonomyLocalization:
      type: "object"
      additionalProperties: false
      required: ["locale","name","description"]
      properties:
        locale:
          type: "string"
          maxLength: 64
        name:
          type: "string"
          maxLength: 80
        description:
          type: "string"
          maxLength: 500
          nullable: true
    TaxonomySummary:
      type: "object"
      additionalProperties: false
      required: ["id","slug","name","default_locale","state"]
      properties:
        id:
          type: "string"
          format: "uuid"
          x-go-type: "string"
        slug:
          type: "string"
          maxLength: 64
        name:
          type: "string"
          maxLength: 80
        default_locale:
          type: "string"
          maxLength: 64
        state: {"$ref":"#/components/schemas/TaxonomyState"}
    TaxonomyDetail:
      type: "object"
      additionalProperties: false
      required: ["id","slug","default_locale","state","localizations","created_at","updated_at"]
      properties:
        id:
          type: "string"
          format: "uuid"
          x-go-type: "string"
        slug:
          type: "string"
          maxLength: 64
        default_locale:
          type: "string"
          maxLength: 64
        state: {"$ref":"#/components/schemas/TaxonomyState"}
        localizations:
          type: "array"
          items: {"$ref":"#/components/schemas/TaxonomyLocalization"}
        created_at:
          type: "string"
          format: "date-time"
        updated_at:
          type: "string"
          format: "date-time"
    TaxonomyList:
      type: "object"
      additionalProperties: false
      required: ["items"]
      properties:
        items:
          type: "array"
          items: {"$ref":"#/components/schemas/TaxonomySummary"}
    CreateTaxonomy:
      type: "object"
      additionalProperties: false
      required: ["slug","default_locale","localization"]
      properties:
        slug:
          type: "string"
          maxLength: 64
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        default_locale:
          type: "string"
          maxLength: 64
        localization: {"$ref":"#/components/schemas/TaxonomyLocalizationInput"}
    PatchTaxonomy:
