openapi: 3.0.3
info:
  title: Tap4Furry Admin API
  version: 0.1.0
  description: Separate password-only Admin authentication with current static roles. Unsafe requests require exact ADMIN_ORIGIN; session mutations also require an Admin session-bound CSRF header. Auth responses are no-store. Public sessions are never accepted.
paths:
  /auth/login:
    post:
      operationId: login
      description: Active, verified local account with moderator, editor or admin role. All ineligible credentials have the same response. Throttle outage fails closed.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Credentials'}
      responses:
        '200': {$ref: '#/components/responses/Authenticated'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /auth/logout:
    post:
      operationId: logout
      security: [{AdminSession: []}]
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses:
        '204': {description: Current Admin session revoked and Admin cookie cleared.}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /auth/reauthenticate:
    post:
      operationId: reauthenticate
      security: [{AdminSession: []}]
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Reauthentication'}
      responses:
        '204': {description: Current Admin session replaced; authenticated_at refreshed; Admin cookie rotated.}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /auth/csrf:
    get:
      operationId: getCsrf
      security: [{AdminSession: []}]
      responses:
        '200':
          description: In-memory verification token for this Admin session only. Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CsrfToken'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /me:
    get:
      operationId: getMe
      security: [{AdminSession: []}]
      responses:
        '200':
          description: Minimal current Admin account; roles re-read from PostgreSQL.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminMe'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /me/sessions:
    get:
      operationId: listSessions
      security: [{AdminSession: []}]
      responses:
        '200':
          description: Own active Admin sessions only.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionList'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /me/sessions/{session_id}:
    delete:
      operationId: revokeSession
      security: [{AdminSession: []}]
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string, format: uuid, x-go-type: string}}
        - {$ref: '#/components/parameters/CSRF'}
      responses:
        '204': {description: Own active Admin session revoked; cookie cleared if current.}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /me/sessions/revoke-others:
    post:
      operationId: revokeOtherSessions
      security: [{AdminSession: []}]
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses:
        '204': {description: Other Admin sessions revoked; Public sessions unaffected.}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /health/live:
    get:
      operationId: getLive
      responses:
        '200':
          description: Process alive; no dependency checks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Live'
  /health/ready:
    get:
      operationId: getReady
      responses:
        '200':
          description: PostgreSQL ready; Redis may be degraded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
        '503':
          description: PostgreSQL unavailable or process shutting down.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
  /resources:
    get:
      operationId: "listResources"
      security: [{"AdminSession":[]}]
      parameters: [{"name":"page","in":"query","required":false,"schema":{"type":"integer","format":"int64","minimum":1,"default":1}},{"name":"page_size","in":"query","required":false,"schema":{"type":"integer","format":"int64","minimum":1,"maximum":100,"default":50}},{"name":"publication_state","in":"query","required":false,"schema":{"$ref":"#/components/schemas/PublicationState"}},{"name":"category_id","in":"query","required":false,"schema":{"type":"string","format":"uuid","x-go-type":"string"}},{"name":"slug","in":"query","required":false,"schema":{"type":"string","maxLength":80}}]
      responses:
        200:
          description: "Canonical result; Cache-Control no-store."
          content:
            application/json:
              schema: {"$ref":"#/components/schemas/ResourceList"}
        400: {"$ref":"#/components/responses/Error"}
        401: {"$ref":"#/components/responses/Error"}
        403: {"$ref":"#/components/responses/Error"}
        404: {"$ref":"#/components/responses/Error"}
        409: {"$ref":"#/components/responses/Error"}
        500: {"$ref":"#/components/responses/Error"}
    post:
      operationId: "createResource"
      security: [{"AdminSession":[]}]
      parameters: [{"$ref":"#/components/parameters/CSRF"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref":"#/components/schemas/CreateResource"}
      responses:
        201:
          description: "Canonical result; Cache-Control no-store."
          content:
            application/json:
              schema: {"$ref":"#/components/schemas/ResourceRevision"}
        400: {"$ref":"#/components/responses/Error"}
        401: {"$ref":"#/components/responses/Error"}
        403: {"$ref":"#/components/responses/Error"}
        404: {"$ref":"#/components/responses/Error"}
        409: {"$ref":"#/components/responses/Error"}
        500: {"$ref":"#/components/responses/Error"}
  /resources/{resource_id}:
    get:
      operationId: "getResource"
      security: [{"AdminSession":[]}]
      parameters: [{"name":"resource_id","in":"path","required":true,"schema":{"type":"string","format":"uuid","x-go-type":"string"}}]
