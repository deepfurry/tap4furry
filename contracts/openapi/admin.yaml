    delete:
      operationId: "deleteResource"
      security: [{"AdminSession":[]}]
      parameters: [{"name":"resource_id","in":"path","required":true,"schema":{"type":"string","format":"uuid","x-go-type":"string"}},{"name":"expected_version","in":"query","required":true,"schema":{"type":"integer","format":"int64","minimum":1}},{"$ref":"#/components/parameters/CSRF"}]
      responses:
