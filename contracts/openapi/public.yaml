openapi: 3.0.3
info:
  title: Tap4Furry Public API
  version: 0.1.0
  description: Public health, authentication, profiles and anonymous Resource knowledge reads. Unsafe requests require exact PUBLIC_ORIGIN; authenticated unsafe requests also require a session-bound CSRF header.
paths:
  /resources:
    get:
      operationId: listResources
      security: []
      description: Anonymous canonical knowledge read. Success uses short shared caching; errors are no-store.
      parameters:
        - $ref: '#/components/parameters/Locale'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Public knowledge; no session or internal governance state.
          headers:
            Cache-Control:
              schema: {type: string}
              description: 'public, max-age=0, s-maxage=60, stale-while-revalidate=30'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceList'}
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /resources/{slug}:
    get:
      operationId: getResource
      security: []
      description: Anonymous canonical knowledge read. Success uses short shared caching; errors are no-store.
      parameters:
        - $ref: '#/components/parameters/Locale'
        - {name: slug, in: path, required: true, schema: {type: string, maxLength: 80}, description: Invalid or noncanonical slug returns RESOURCE_NOT_FOUND.}
      responses:
        '200':
          description: Public knowledge; no session or internal governance state.
          headers:
            Cache-Control:
              schema: {type: string}
              description: 'public, max-age=0, s-maxage=60, stale-while-revalidate=30'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceDetail'}
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /categories:
    get:
      operationId: listCategories
      security: []
      description: Anonymous canonical knowledge read. Success uses short shared caching; errors are no-store.
      parameters:
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Public knowledge; no session or internal governance state.
          headers:
            Cache-Control:
              schema: {type: string}
              description: 'public, max-age=0, s-maxage=60, stale-while-revalidate=30'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CategoryList'}
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /tags:
    get:
      operationId: listTags
      security: []
      description: Anonymous canonical knowledge read. Success uses short shared caching; errors are no-store.
      parameters:
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Public knowledge; no session or internal governance state.
          headers:
            Cache-Control:
              schema: {type: string}
              description: 'public, max-age=0, s-maxage=60, stale-while-revalidate=30'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TagList'}
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /auth/oauth/{provider}/start:
    get:
      operationId: startOAuth
      parameters: [{$ref: '#/components/parameters/Provider'}]
      description: Start login with one-time, browser-bound state and S256 PKCE. No return URL is accepted.
      responses:
        '302':
          $ref: '#/components/responses/OAuthRedirect'
  /auth/oauth/{provider}/callback:
    get:
      operationId: completeOAuth
      parameters:
        - $ref: '#/components/parameters/Provider'
        - {in: query, name: state, schema: {type: string}}
        - {in: query, name: code, schema: {type: string}}
        - {in: query, name: error, schema: {type: string}}
      description: Consume one-time state, validate provider identity and commit before setting a session cookie. Redirect only to fixed same-origin pages; never forward provider errors or tokens.
      responses:
        '302':
          $ref: '#/components/responses/OAuthRedirect'
  /me/auth-methods:
    get:
      operationId: getAuthMethods
      security: [{PublicSession: []}]
      responses:
        '200':
          description: Private authentication methods, without provider subjects or tokens. Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthMethods'}
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /me/auth-methods/{provider}/link:
    post:
      operationId: linkOAuthProvider
      security: [{PublicSession: []}]
      parameters: [{$ref: '#/components/parameters/Provider'}, {$ref: '#/components/parameters/CSRF'}]
      description: Requires authentication within 15 minutes. Returns provider URL and sets an HttpOnly flow binding cookie. Callback revalidates the initiating session and freshness.
      responses:
        '200':
          $ref: '#/components/responses/OAuthAuthorization'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /me/auth-methods/{provider}/reauthenticate:
    post:
      operationId: reauthenticateOAuthProvider
      security: [{PublicSession: []}]
      parameters: [{$ref: '#/components/parameters/Provider'}, {$ref: '#/components/parameters/CSRF'}]
      description: Reauthenticate with the exact linked provider subject. Callback rotates the current session and refreshes authenticated_at.
      responses:
        '200':
          $ref: '#/components/responses/OAuthAuthorization'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /me/auth-methods/{provider}:
    delete:
      operationId: unlinkOAuthProvider
      security: [{PublicSession: []}]
      parameters: [{$ref: '#/components/parameters/Provider'}, {$ref: '#/components/parameters/CSRF'}]
      description: Requires freshness within 15 minutes and another authentication method. The current auth_method must differ from the removed provider. Revokes its sessions, rotates this session, preserving its authentication time and method.
      responses:
        '200':
          $ref: '#/components/responses/Authenticated'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /auth/register:
    post:
      operationId: register
      description: Register a local identity and set an HttpOnly public session cookie. Requires exact PUBLIC_ORIGIN.
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '201':
          $ref: '#/components/responses/Authenticated'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /auth/login:
    post:
      operationId: login
      description: Verify credentials and set a new HttpOnly public session cookie. Requires exact PUBLIC_ORIGIN.
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '200':
          $ref: '#/components/responses/Authenticated'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      operationId: logout
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      description: Revoke the current public session and clear its cookie. Requires exact PUBLIC_ORIGIN.
      security: [{PublicSession: []}]
      responses:
        '204':
          description: Session revoked; Set-Cookie expires the public session cookie.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /me:
    get:
      operationId: getMe
      security: [{PublicSession: []}]
      responses:
        '200':
          $ref: '#/components/responses/CurrentUser'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /me/profile:
    patch:
      operationId: updateProfile
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      description: Omitted fields are retained; null clears nullable fields. Requires exact PUBLIC_ORIGIN.
      security: [{PublicSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          $ref: '#/components/responses/CurrentUser'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /auth/csrf:
    get:
      operationId: getCsrf
      security: [{PublicSession: []}]
      responses:
        '200':
          description: Session-bound HMAC; Cache-Control no-store. Keep only in browser memory and discard on session rotation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /auth/email/verification/request:
    post:
      operationId: requestEmailVerification
      security: [{PublicSession: []}]
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /auth/email/verification:
    post:
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeToken'
      responses:
        '204':
          description: Email verified; challenge consumed once.
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /auth/password/reset/request:
    post:
      operationId: requestPasswordReset
      description: Identical accepted response for eligible, unknown or inactive accounts and delivery failures. Does not reveal account existence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /auth/password/reset:
    post:
      operationId: resetPassword
      description: Consume challenge, replace password, revoke all Public and Admin sessions and issue one new Public session. Does not verify email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReset'
      responses:
        '200':
          $ref: '#/components/responses/Authenticated'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /auth/password/change:
    post:
      operationId: changePassword
      security: [{PublicSession: []}]
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      responses:
        '200':
          $ref: '#/components/responses/Authenticated'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /auth/reauthenticate:
    post:
      operationId: reauthenticate
      description: Verify password and rotate the current session, setting authenticated_at to now.
      security: [{PublicSession: []}]
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reauthentication'
      responses:
        '204':
          description: Reauthenticated; Set-Cookie contains a replacement HttpOnly session.
          headers:
            Set-Cookie:
              schema: {type: string}
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /me/sessions:
    get:
      operationId: listSessions
      security: [{PublicSession: []}]
      responses:
        '200':
          description: Only this user's active public sessions; Cache-Control no-store. No token or token hash.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /me/sessions/{session_id}:
    delete:
      operationId: revokeSession
      security: [{PublicSession: []}]
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - in: path
          name: session_id
          required: true
          schema: {type: string, format: uuid, x-go-type: string}
      responses:
        '204':
          description: Owned public session revoked. Revoking the current session also clears its cookie.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /me/sessions/revoke-others:
    post:
      operationId: revokeOtherSessions
      security: [{PublicSession: []}]
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses:
        '204':
          description: All other public sessions revoked; current session preserved.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /users/{handle}:
    get:
      operationId: getPublicProfile
      parameters:
        - in: path
          name: handle
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Public profile only; no account or authentication fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfile'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /health/live:
    get:
      operationId: getLive
      responses:
        '200':
          description: Process alive; no dependency checks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Live'
  /health/ready:
    get:
      operationId: getReady
      responses:
        '200':
          description: PostgreSQL ready; Redis may be degraded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
        '503':
          description: PostgreSQL unavailable or process shutting down.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
  /contributions/context/{slug}:
    get:
      operationId: "getContributionContext"
      security: [{"PublicSession":[]}]
      parameters: [{"name":"slug","in":"path","required":true,"schema":{"type":"string","maxLength":80}},{"name":"kind","in":"query","required":false,"schema":{"type":"string","enum":["create_resource","update_resource","add_source","remove_broken_source","add_tag","add_relation","add_translation"]}},{"name":"source_id","in":"query","required":false,"schema":{"type":"string","format":"uuid","x-go-type":"string"}},{"name":"locale","in":"query","required":false,"schema":{"type":"string","maxLength":64}},{"name":"other_slug","in":"query","required":false,"schema":{"type":"string","maxLength":80}},{"name":"direction","in":"query","required":false,"schema":{"type":"string","enum":["outgoing","incoming","symmetric"]}},{"name":"relation_type","in":"query","required":false,"schema":{"type":"string","enum":["part_of","successor_of","derived_from","related_to"]}}]
      responses:
        200:
          description: "Private contribution response; Cache-Control no-store."
          content:
            application/json:
              schema: {"$ref":"#/components/schemas/ContributionContext"}
        400: {"$ref":"#/components/responses/Error"}
        401: {"$ref":"#/components/responses/Error"}
        403: {"$ref":"#/components/responses/Error"}
        404: {"$ref":"#/components/responses/Error"}
        409: {"$ref":"#/components/responses/Error"}
        429:
          description: "Contribution quota reached. Retry-After is omitted when waiting for review."
          headers:
            Retry-After:
              schema:
                type: "integer"
                minimum: 1
          content:
            application/json:
              schema: {"$ref":"#/components/schemas/ApiError"}
        500: {"$ref":"#/components/responses/Error"}
  /contributions:
    post:
      operationId: "submitContribution"
      security: [{"PublicSession":[]}]
      parameters: [{"$ref":"#/components/parameters/CSRF"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref":"#/components/schemas/SubmitContribution"}
      responses:
        201:
          description: "Private contribution response; Cache-Control no-store."
          content:
            application/json:
              schema: {"$ref":"#/components/schemas/ContributionCreated"}
        400: {"$ref":"#/components/responses/Error"}
        401: {"$ref":"#/components/responses/Error"}
        403: {"$ref":"#/components/responses/Error"}
        404: {"$ref":"#/components/responses/Error"}
        409: {"$ref":"#/components/responses/Error"}
        429:
          description: "Contribution quota reached. Retry-After is omitted when waiting for review."
          headers:
            Retry-After:
              schema:
                type: "integer"
                minimum: 1
          content:
            application/json:
              schema: {"$ref":"#/components/schemas/ApiError"}
        500: {"$ref":"#/components/responses/Error"}
  /me/contributions:
    get:
      operationId: "listMyContributions"
      security: [{"PublicSession":[]}]
      parameters: [{"name":"page","in":"query","required":false,"schema":{"type":"integer","format":"int64","minimum":1,"default":1}},{"name":"page_size","in":"query","required":false,"schema":{"type":"integer","minimum":1,"maximum":100,"default":20}},{"name":"status","in":"query","required":false,"schema":{"$ref":"#/components/schemas/ContributionStatus"}}]
      responses:
        200:
          description: "Private contribution response; Cache-Control no-store."
          content:
            application/json:
              schema: {"$ref":"#/components/schemas/ContributionList"}
        400: {"$ref":"#/components/responses/Error"}
        401: {"$ref":"#/components/responses/Error"}
        403: {"$ref":"#/components/responses/Error"}
        404: {"$ref":"#/components/responses/Error"}
        409: {"$ref":"#/components/responses/Error"}
        429:
          description: "Contribution quota reached. Retry-After is omitted when waiting for review."
          headers:
            Retry-After:
              schema:
                type: "integer"
                minimum: 1
          content:
            application/json:
              schema: {"$ref":"#/components/schemas/ApiError"}
        500: {"$ref":"#/components/responses/Error"}
  /me/contributions/{contribution_id}:
    get:
      operationId: "getMyContribution"
      security: [{"PublicSession":[]}]
      parameters: [{"name":"contribution_id","in":"path","required":true,"schema":{"type":"string","format":"uuid","x-go-type":"string"}}]
      responses:
        200:
          description: "Private contribution response; Cache-Control no-store."
          content:
            application/json:
              schema: {"$ref":"#/components/schemas/ContributionDetail"}
        400: {"$ref":"#/components/responses/Error"}
        401: {"$ref":"#/components/responses/Error"}
        403: {"$ref":"#/components/responses/Error"}
        404: {"$ref":"#/components/responses/Error"}
        409: {"$ref":"#/components/responses/Error"}
        429:
          description: "Contribution quota reached. Retry-After is omitted when waiting for review."
          headers:
            Retry-After:
              schema:
                type: "integer"
                minimum: 1
          content:
            application/json:
              schema: {"$ref":"#/components/schemas/ApiError"}
        500: {"$ref":"#/components/responses/Error"}
  /me/contributions/{contribution_id}/withdraw:
    post:
      operationId: "withdrawContribution"
      security: [{"PublicSession":[]}]
      parameters: [{"name":"contribution_id","in":"path","required":true,"schema":{"type":"string","format":"uuid","x-go-type":"string"}},{"$ref":"#/components/parameters/CSRF"}]
      responses:
        204:
          description: "Private contribution response; Cache-Control no-store."
        400: {"$ref":"#/components/responses/Error"}
        401: {"$ref":"#/components/responses/Error"}
        403: {"$ref":"#/components/responses/Error"}
        404: {"$ref":"#/components/responses/Error"}
        409: {"$ref":"#/components/responses/Error"}
        429:
          description: "Contribution quota reached. Retry-After is omitted when waiting for review."
          headers:
            Retry-After:
              schema:
                type: "integer"
                minimum: 1
          content:
            application/json:
              schema: {"$ref":"#/components/schemas/ApiError"}
        500: {"$ref":"#/components/responses/Error"}
components:
  parameters:
    Locale:
      name: locale
      in: query
      required: false
      schema: {type: string, minLength: 2, maxLength: 64}
      description: Canonical locale with exact-match field fallback; omitted uses each entity default.
    Page:
      name: page
      in: query
      required: false
      schema: {type: integer, format: int64, minimum: 1, default: 1}
    PageSize:
      name: page_size
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 24}
    Provider:
      in: path
      name: provider
      required: true
      schema: {$ref: '#/components/schemas/OAuthProvider'}
    CSRF:
      in: header
      name: X-CSRF-Token
      required: true
      description: Obtain from GET /auth/csrf for the current session. Exact PUBLIC_ORIGIN is also required.
      schema: {type: string}
  securitySchemes:
    PublicSession:
      type: apiKey
      in: cookie
      name: __Host-tap4furry_session
      description: Production uses Secure, HttpOnly, SameSite=Lax, Path=/ and no Domain. Local HTTP development/test uses tap4furry_session.
  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Credentials'
  responses:
    OAuthRedirect:
      description: No-store, no-referrer redirect. Start sets a short-lived HttpOnly flow cookie; a successful callback sets the public session cookie after commit.
      headers:
        Location:
          schema: {type: string}
        Set-Cookie:
          schema: {type: string}
    OAuthAuthorization:
      description: No-store authorization URL for a top-level browser navigation, with an HttpOnly flow binding cookie. Never store the URL.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/OAuthAuthorization'}
    Accepted:
      description: Request accepted, including cooldown or ineligible account. No challenge token is returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Accepted'
    Authenticated:
      description: Current user; a new opaque session is delivered only through Set-Cookie.
      headers:
        Set-Cookie:
          schema:
            type: string
          description: HttpOnly public session cookie; never exposed as JSON.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Me'
    CurrentUser:
      description: Private current-user view; Cache-Control is no-store.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Me'
    Error:
      description: Stable error code and safe message; never driver or credential details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
