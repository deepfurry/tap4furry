openapi: 3.0.3
info:
  title: GoFurry Public API
  version: 0.1.0
  description: Public health, local authentication, session security and basic profiles. Unsafe requests require exact PUBLIC_ORIGIN; authenticated unsafe requests also require a session-bound CSRF header.
paths:
  /auth/oauth/{provider}/start:
    get:
      operationId: startOAuth
      parameters: [{$ref: '#/components/parameters/Provider'}]
      description: Start login with one-time, browser-bound state and S256 PKCE. No return URL is accepted.
      responses:
        '302':
          $ref: '#/components/responses/OAuthRedirect'
  /auth/oauth/{provider}/callback:
    get:
      operationId: completeOAuth
      parameters:
        - $ref: '#/components/parameters/Provider'
        - {in: query, name: state, schema: {type: string}}
        - {in: query, name: code, schema: {type: string}}
        - {in: query, name: error, schema: {type: string}}
      description: Consume one-time state, validate provider identity and commit before setting a session cookie. Redirect only to fixed same-origin pages; never forward provider errors or tokens.
      responses:
        '302':
          $ref: '#/components/responses/OAuthRedirect'
  /me/auth-methods:
    get:
      operationId: getAuthMethods
      security: [{PublicSession: []}]
      responses:
        '200':
          description: Private authentication methods, without provider subjects or tokens. Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthMethods'}
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /me/auth-methods/{provider}/link:
    post:
      operationId: linkOAuthProvider
      security: [{PublicSession: []}]
      parameters: [{$ref: '#/components/parameters/Provider'}, {$ref: '#/components/parameters/CSRF'}]
      description: Requires authentication within 15 minutes. Returns provider URL and sets an HttpOnly flow binding cookie. Callback revalidates the initiating session and freshness.
      responses:
        '200':
          $ref: '#/components/responses/OAuthAuthorization'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /me/auth-methods/{provider}/reauthenticate:
    post:
      operationId: reauthenticateOAuthProvider
      security: [{PublicSession: []}]
      parameters: [{$ref: '#/components/parameters/Provider'}, {$ref: '#/components/parameters/CSRF'}]
      description: Reauthenticate with the exact linked provider subject. Callback rotates the current session and refreshes authenticated_at.
      responses:
        '200':
          $ref: '#/components/responses/OAuthAuthorization'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /me/auth-methods/{provider}:
    delete:
      operationId: unlinkOAuthProvider
      security: [{PublicSession: []}]
      parameters: [{$ref: '#/components/parameters/Provider'}, {$ref: '#/components/parameters/CSRF'}]
      description: Requires freshness within 15 minutes and another authentication method. The current auth_method must differ from the removed provider. Revokes its sessions, rotates this session, preserving its authentication time and method.
      responses:
        '200':
          $ref: '#/components/responses/Authenticated'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /auth/register:
    post:
      operationId: register
      description: Register a local identity and set an HttpOnly public session cookie. Requires exact PUBLIC_ORIGIN.
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '201':
          $ref: '#/components/responses/Authenticated'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /auth/login:
    post:
      operationId: login
      description: Verify credentials and set a new HttpOnly public session cookie. Requires exact PUBLIC_ORIGIN.
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '200':
          $ref: '#/components/responses/Authenticated'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      operationId: logout
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      description: Revoke the current public session and clear its cookie. Requires exact PUBLIC_ORIGIN.
      security: [{PublicSession: []}]
      responses:
        '204':
          description: Session revoked; Set-Cookie expires the public session cookie.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /me:
    get:
      operationId: getMe
      security: [{PublicSession: []}]
      responses:
        '200':
          $ref: '#/components/responses/CurrentUser'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /me/profile:
    patch:
      operationId: updateProfile
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      description: Omitted fields are retained; null clears nullable fields. Requires exact PUBLIC_ORIGIN.
      security: [{PublicSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          $ref: '#/components/responses/CurrentUser'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /auth/csrf:
    get:
      operationId: getCsrf
      security: [{PublicSession: []}]
      responses:
        '200':
          description: Session-bound HMAC; Cache-Control no-store. Keep only in browser memory and discard on session rotation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /auth/email/verification/request:
    post:
      operationId: requestEmailVerification
      security: [{PublicSession: []}]
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /auth/email/verification:
    post:
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeToken'
      responses:
        '204':
          description: Email verified; challenge consumed once.
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /auth/password/reset/request:
    post:
      operationId: requestPasswordReset
      description: Identical accepted response for eligible, unknown or inactive accounts and delivery failures. Does not reveal account existence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /auth/password/reset:
    post:
      operationId: resetPassword
      description: Consume challenge, replace password, revoke all Public and Admin sessions and issue one new Public session. Does not verify email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReset'
      responses:
        '200':
          $ref: '#/components/responses/Authenticated'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /auth/password/change:
    post:
      operationId: changePassword
      security: [{PublicSession: []}]
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      responses:
        '200':
          $ref: '#/components/responses/Authenticated'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /auth/reauthenticate:
    post:
      operationId: reauthenticate
      description: Verify password and rotate the current session, setting authenticated_at to now.
      security: [{PublicSession: []}]
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reauthentication'
      responses:
        '204':
          description: Reauthenticated; Set-Cookie contains a replacement HttpOnly session.
          headers:
            Set-Cookie:
              schema: {type: string}
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /me/sessions:
    get:
      operationId: listSessions
      security: [{PublicSession: []}]
      responses:
        '200':
          description: Only this user's active public sessions; Cache-Control no-store. No token or token hash.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /me/sessions/{session_id}:
    delete:
      operationId: revokeSession
      security: [{PublicSession: []}]
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - in: path
          name: session_id
          required: true
          schema: {type: string, format: uuid, x-go-type: string}
      responses:
        '204':
          description: Owned public session revoked. Revoking the current session also clears its cookie.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /me/sessions/revoke-others:
    post:
      operationId: revokeOtherSessions
      security: [{PublicSession: []}]
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses:
        '204':
          description: All other public sessions revoked; current session preserved.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /users/{handle}:
    get:
      operationId: getPublicProfile
      parameters:
        - in: path
          name: handle
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Public profile only; no account or authentication fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfile'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /health/live:
    get:
      operationId: getLive
      responses:
        '200':
          description: Process alive; no dependency checks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Live'
  /health/ready:
    get:
      operationId: getReady
      responses:
        '200':
          description: PostgreSQL ready; Redis may be degraded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
        '503':
          description: PostgreSQL unavailable or process shutting down.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
components:
  parameters:
    Provider:
      in: path
      name: provider
      required: true
      schema: {$ref: '#/components/schemas/OAuthProvider'}
    CSRF:
      in: header
      name: X-CSRF-Token
      required: true
      description: Obtain from GET /auth/csrf for the current session. Exact PUBLIC_ORIGIN is also required.
      schema: {type: string}
  securitySchemes:
    PublicSession:
      type: apiKey
      in: cookie
      name: __Host-gofurry_session
      description: Production uses Secure, HttpOnly, SameSite=Lax, Path=/ and no Domain. Local HTTP development/test uses gofurry_session.
  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Credentials'
  responses:
    OAuthRedirect:
      description: No-store, no-referrer redirect. Start sets a short-lived HttpOnly flow cookie; a successful callback sets the public session cookie after commit.
      headers:
        Location:
          schema: {type: string}
        Set-Cookie:
          schema: {type: string}
    OAuthAuthorization:
      description: No-store authorization URL for a top-level browser navigation, with an HttpOnly flow binding cookie. Never store the URL.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/OAuthAuthorization'}
    Accepted:
      description: Request accepted, including cooldown or ineligible account. No challenge token is returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Accepted'
    Authenticated:
      description: Current user; a new opaque session is delivered only through Set-Cookie.
      headers:
        Set-Cookie:
          schema:
            type: string
          description: HttpOnly public session cookie; never exposed as JSON.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Me'
    CurrentUser:
      description: Private current-user view; Cache-Control is no-store.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Me'
    Error:
      description: Stable error code and safe message; never driver or credential details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    OAuthProvider:
      type: string
      enum: [google, github]
    OAuthAuthorization:
      type: object
      additionalProperties: false
      required: [authorization_url]
      properties:
        authorization_url: {type: string}
    AuthMethods:
      type: object
      additionalProperties: false
      required: [password, providers]
      properties:
        password: {type: boolean}
        providers:
          type: array
          items: {$ref: '#/components/schemas/ProviderMethod'}
    ProviderMethod:
      type: object
      additionalProperties: false
      required: [provider, email, linked_at]
      properties:
        provider: {$ref: '#/components/schemas/OAuthProvider'}
        email: {type: string, nullable: true}
        linked_at: {type: string, format: date-time}
    Accepted:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: {type: string}
    CsrfToken:
      type: object
      additionalProperties: false
      required: [csrf_token]
      properties:
        csrf_token: {type: string}
    ChallengeToken:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: {type: string, writeOnly: true, minLength: 43, maxLength: 43}
    ResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: {type: string, maxLength: 254}
    PasswordReset:
      type: object
      additionalProperties: false
      required: [token, new_password]
      properties:
        token: {type: string, writeOnly: true, minLength: 43, maxLength: 43}
        new_password: {type: string, writeOnly: true, minLength: 15, maxLength: 128}
    PasswordChange:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: {type: string, writeOnly: true, minLength: 15, maxLength: 128}
        new_password: {type: string, writeOnly: true, minLength: 15, maxLength: 128}
    Reauthentication:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: {type: string, writeOnly: true, minLength: 15, maxLength: 128}
    SessionList:
      type: object
      additionalProperties: false
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/Session'
    Session:
      type: object
      additionalProperties: false
      required: [id, auth_method, authenticated_at, created_at, last_seen_at, idle_expires_at, absolute_expires_at, current]
      properties:
        id: {type: string, format: uuid, x-go-type: string}
        auth_method: {type: string, enum: [password, password_reset, google, github]}
        authenticated_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
        idle_expires_at: {type: string, format: date-time}
        absolute_expires_at: {type: string, format: date-time}
        current: {type: boolean}
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
          description: Plain email; surrounding whitespace is trimmed and lookup is lowercase. Dots and plus tags are preserved.
        password:
          type: string
          minLength: 15
          maxLength: 128
          writeOnly: true
          description: Unicode code points; no trimming, normalization or composition requirements.
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [VALIDATION_ERROR, AUTH_EMAIL_ALREADY_REGISTERED, AUTH_INVALID_CREDENTIALS, AUTH_UNAUTHENTICATED, AUTH_ACCOUNT_DISABLED, PROFILE_HANDLE_UNAVAILABLE, PROFILE_NOT_FOUND, ORIGIN_FORBIDDEN, CSRF_INVALID, AUTH_CHALLENGE_INVALID, AUTH_REAUTH_FAILED, AUTH_SESSION_NOT_FOUND, MAIL_UNAVAILABLE, AUTH_PROVIDER_UNAVAILABLE, AUTH_PROVIDER_INVALID, AUTH_PROVIDER_ALREADY_LINKED, AUTH_PROVIDER_NOT_LINKED, AUTH_ACCOUNT_LINK_REQUIRED, AUTH_REAUTH_REQUIRED, AUTH_LAST_METHOD, AUTH_RATE_LIMITED, INTERNAL_ERROR]
        message:
          type: string
    Handle:
      type: string
      nullable: true
      minLength: 3
      maxLength: 32
      pattern: '^[a-z0-9][a-z0-9_-]{2,31}$'
    ProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        handle:
          $ref: '#/components/schemas/Handle'
        display_name:
          type: string
          nullable: true
          maxLength: 80
        bio:
          type: string
          nullable: true
          maxLength: 500
        search_engine_indexing:
          type: boolean
    Profile:
      type: object
      additionalProperties: false
      required: [handle, display_name, bio, search_engine_indexing]
      properties:
        handle:
          $ref: '#/components/schemas/Handle'
        display_name:
          type: string
          nullable: true
          maxLength: 80
        bio:
          type: string
          nullable: true
          maxLength: 500
        search_engine_indexing:
          type: boolean
    PublicProfile:
      type: object
      additionalProperties: false
      required: [handle, display_name, bio]
      properties:
        handle:
          type: string
        display_name:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
    Me:
      type: object
      additionalProperties: false
      required: [id, account_state, created_at, profile, email, email_verified]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: string
        account_state:
          type: string
          enum: [active]
        created_at:
          type: string
          format: date-time
        profile:
          $ref: '#/components/schemas/Profile'
        email:
          type: string
        email_verified:
          type: boolean
    Live:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [alive]
    Ready:
      type: object
      additionalProperties: false
      required: [status, postgres, redis]
      properties:
        status:
          type: string
          enum: [ready, degraded, unavailable]
        postgres:
          type: string
          enum: [up, down]
        redis:
          type: string
          enum: [up, down]
